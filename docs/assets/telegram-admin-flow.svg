<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Telegram admin download flow</title>
  <desc id="desc">A sequence diagram for sending a YouTube link to the Yagami Telegram bot, choosing quality, and watching live progress.</desc>
  <rect width="1200" height="520" rx="24" fill="#0B0F14"/>
  <rect x="36" y="36" width="1128" height="448" rx="18" fill="#111821" stroke="#26313D"/>
  <text x="72" y="94" fill="#F4F7FA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">Admin Link Flow</text>
  <text x="72" y="124" fill="#95A3B3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Every YouTube link becomes an observable job: quality choice, yt-dlp progress, Telegram upload, final delivery.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(72 190)">
      <rect width="190" height="190" rx="16" fill="#18212C" stroke="#344252"/>
      <text x="24" y="44" fill="#F4F7FA" font-size="20" font-weight="700">1. Send link</text>
      <text x="24" y="78" fill="#95A3B3" font-size="14">Paste any YouTube URL</text>
      <text x="24" y="102" fill="#95A3B3" font-size="14">into the admin DM.</text>
      <rect x="24" y="130" width="142" height="34" rx="8" fill="#0B0F14" stroke="#26313D"/>
      <text x="44" y="152" fill="#D7DEE8" font-size="13">youtu.be/...</text>
    </g>

    <g transform="translate(326 190)">
      <rect width="190" height="190" rx="16" fill="#142535" stroke="#2D5B76"/>
      <text x="24" y="44" fill="#F4F7FA" font-size="20" font-weight="700">2. Choose quality</text>
      <text x="24" y="78" fill="#A9D7F3" font-size="14">Bot probes formats</text>
      <text x="24" y="102" fill="#A9D7F3" font-size="14">and shows buttons.</text>
      <rect x="24" y="130" width="58" height="34" rx="8" fill="#0B0F14" stroke="#3E6D8A"/>
      <text x="43" y="152" fill="#D7DEE8" font-size="13">Best</text>
      <rect x="90" y="130" width="70" height="34" rx="8" fill="#0B0F14" stroke="#3E6D8A"/>
      <text x="110" y="152" fill="#D7DEE8" font-size="13">1080p</text>
    </g>

    <g transform="translate(580 190)">
      <rect width="190" height="190" rx="16" fill="#1C1B16" stroke="#615A37"/>
      <text x="24" y="44" fill="#F4F7FA" font-size="20" font-weight="700">3. Download</text>
      <text x="24" y="78" fill="#E6D887" font-size="14">yt-dlp reports live</text>
      <text x="24" y="102" fill="#E6D887" font-size="14">speed and ETA.</text>
      <rect x="24" y="134" width="142" height="14" rx="7" fill="#0B0F14"/>
      <rect x="24" y="134" width="92" height="14" rx="7" fill="#E6D887"/>
    </g>

    <g transform="translate(834 190)">
      <rect width="190" height="190" rx="16" fill="#151E31" stroke="#314F89"/>
      <text x="24" y="44" fill="#F4F7FA" font-size="20" font-weight="700">4. Upload</text>
      <text x="24" y="78" fill="#AFC8FF" font-size="14">Pipelined MTProto</text>
      <text x="24" y="102" fill="#AFC8FF" font-size="14">with native cryptg.</text>
      <rect x="24" y="130" width="142" height="34" rx="8" fill="#0B0F14" stroke="#314F89"/>
      <text x="47" y="152" fill="#D7DEE8" font-size="13">7.7 MB/s</text>
    </g>
  </g>

  <g stroke="#465567" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 285H326"/>
    <path d="M516 285H580"/>
    <path d="M770 285H834"/>
  </g>

  <text x="72" y="440" fill="#D7DEE8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">The same status events stream to the web Downloads page, so Telegram and the browser stay in sync.</text>
</svg>