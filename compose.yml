# ============================================================
#  Project Yagami — Compose
#  Start everything: docker compose up -d
#  Open the web UI:  http://localhost:8787
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: yagami
      POSTGRES_USER: yagami
      POSTGRES_PASSWORD: yagami
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yagami"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - natsdata:/data
    expose:
      - "4222"
      - "8222"
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://yagami:yagami@postgres:5432/yagami
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_started }
    volumes:
      - cookies:/cookies
    restart: unless-stopped

  youtube-poller:
    build: ./services/youtube-poller
    environment:
      DATABASE_URL: postgres://yagami:yagami@postgres:5432/yagami
      NATS_URL: nats://nats:4222
      COOKIES_PATH: /cookies/cookies.txt
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_started }
    volumes:
      - cookies:/cookies
    restart: unless-stopped

  downloader:
    build: ./services/downloader
    environment:
      DATABASE_URL: postgres://yagami:yagami@postgres:5432/yagami
      NATS_URL: nats://nats:4222
      DOWNLOAD_DIR: /tmp/ytdl
      COOKIES_PATH: /cookies/cookies.txt
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_started }
    volumes:
      - downloads:/tmp/ytdl
      - cookies:/cookies
    restart: unless-stopped

  telegram-client:
    build: ./services/telegram-client
    environment:
      DATABASE_URL: postgres://yagami:yagami@postgres:5432/yagami
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_started }
    volumes:
      - downloads:/tmp/ytdl
      - telegram_session:/app/session
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    ports:
      - "127.0.0.1:8787:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  pgdata:
  natsdata:
  telegram_session:
  cookies:
  downloads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10g
